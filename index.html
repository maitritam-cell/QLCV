<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QLCV – Quản lý công việc</title><link rel="stylesheet" href="style.css"></head>
<body>
<section id="auth" class="auth"><div class="card"><div class="logo">QLCV</div><h1>Quản lý công việc</h1><p class="muted">Đăng nhập hệ thống</p>
<div class="tabs"><button type="button" id="loginTab" class="active" onclick="setAuthMode('login')">Đăng nhập</button><button type="button" id="signupTab" onclick="setAuthMode('signup')">Đăng ký</button></div>
<form id="authForm"><label id="nameBox" class="hidden">Họ và tên<input id="name"></label><label>Email<input id="email" type="email" required></label><label>Mật khẩu<input id="password" type="password" minlength="6" required></label><button class="primary" id="authBtn">Đăng nhập</button></form><button id="reset" class="link">Quên mật khẩu</button><p id="authMsg"></p></div></section>
<section id="app" class="hidden"><header><div><b>QLCV</b><span>Quản lý công việc</span></div><div class="actions"><span id="role"></span><button id="refresh">Làm mới</button><button id="logout">Đăng xuất</button></div></header>
<main><div class="welcome"><div><h2 id="welcome"></h2><p class="muted">Theo dõi, giao việc và cập nhật tiến độ.</p></div><button id="newTask" class="primary hidden">+ Giao việc</button></div>
<div class="stats"><div><small>Tổng</small><strong id="sAll">0</strong></div><div><small>Chưa bắt đầu</small><strong id="sTodo">0</strong></div><div><small>Đang thực hiện</small><strong id="sDoing">0</strong></div><div><small>Hoàn thành</small><strong id="sDone">0</strong></div><div><small>Quá hạn</small><strong id="sLate">0</strong></div></div>
<div class="toolbar"><input id="search" placeholder="Tìm kiếm công việc..."><select id="status"><option value="">Tất cả trạng thái</option><option>Chưa bắt đầu</option><option>Đang thực hiện</option><option>Đã hoàn thành</option><option>Quá hạn</option></select><select id="priority"><option value="">Tất cả mức độ</option><option>Bình thường</option><option>Quan trọng</option><option>Khẩn</option></select></div>
<div class="layout"><section class="panel"><div class="panelHead"><h3>Danh sách công việc</h3><span id="count"></span></div><div id="tasks"></div></section><aside class="panel profile"><h3>Hồ sơ</h3><label>Họ tên<input id="pName"></label><label>Đơn vị<input id="pUnit"></label><label>Số điện thoại<input id="pPhone"></label><button id="saveProfile" class="secondary">Lưu hồ sơ</button><hr><small>Vai trò</small><b id="pRole"></b></aside></div></main></section>
<div id="modal" class="modal hidden"><div class="modalCard"><h3>Giao công việc</h3><form id="taskForm"><label>Tiêu đề<input id="tTitle" required></label><label>Nội dung<textarea id="tDesc"></textarea></label><div class="grid"><label>Người thực hiện<select id="tAssignee"></select></label><label>Hạn hoàn thành<input id="tDue" type="date"></label><label>Mức độ<select id="tPriority"><option>Bình thường</option><option>Quan trọng</option><option>Khẩn</option></select></label><label>Nhóm<select id="tGroup"><option>Thường xuyên</option><option>Chuyên đề</option><option>Đột xuất</option></select></label></div><div class="modalActions"><button type="button" id="cancel">Hủy</button><button class="primary">Tạo công việc</button></div></form></div></div>
<div id="updateModal" class="modal hidden"><div class="modalCard"><h3>Cập nhật công việc</h3><form id="updateForm"><input id="uId" type="hidden"><label>Trạng thái<select id="uStatus"><option>Chưa bắt đầu</option><option>Đang thực hiện</option><option>Đã hoàn thành</option><option>Quá hạn</option></select></label><label>Tiến độ <span id="uLabel">0%</span><input id="uProgress" type="range" min="0" max="100" step="5"></label><label>Ghi chú<textarea id="uNote"></textarea></label><div class="modalActions"><button type="button" id="uCancel">Hủy</button><button class="primary">Cập nhật</button></div></form></div></div>
<script>function setAuthMode(mode){var n=document.getElementById("nameBox"),l=document.getElementById("loginTab"),s=document.getElementById("signupTab"),b=document.getElementById("authBtn");var signup=mode==="signup";n.classList.toggle("hidden",!signup);l.classList.toggle("active",!signup);s.classList.toggle("active",signup);b.textContent=signup?"Tạo tài khoản":"Đăng nhập";var m=document.getElementById("authMsg");if(m)m.textContent=""}</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="app.js?v=3"></script></body></html>
